<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RustBrowse Shell</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Row 1: Unlimited Scrollable Tab Strip (36px) -->
  <div class="tab-strip" id="tab-strip">
    <div class="tabs-scroll-wrap" id="tabs-scroll-wrap">
      <div class="tabs-container" id="tabs-container" role="tablist" aria-label="Browser tabs">
        <!-- Tabs dynamically injected -->
      </div>
      <div class="tab-strip-spacer" id="tab-strip-spacer" title="Nhấp đúp để mở tab mới"></div>
    </div>
    <!-- Permanently Pinned '+' New Tab Button (strictly outside horizontal scroll, never disappears at 50+ tabs) -->
    <div class="tab-strip-end">
      <button class="btn-icon btn-new-tab" id="btn-new-tab" type="button" title="Mở tab mới (Ctrl+T)" aria-label="Mở tab mới">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Row 2: Navigation, iOS Dynamic Island Capsule & Action Toolbar (38px) -->
  <div class="toolbar" id="toolbar">
    <!-- Left Navigation Cluster -->
    <div class="nav-cluster">
      <button class="btn-icon" id="btn-back" type="button" title="Quay lại (Alt+Left)" aria-label="Quay lại">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button class="btn-icon" id="btn-forward" type="button" title="Tiến tới (Alt+Right)" aria-label="Tiến tới">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <button class="btn-icon" id="btn-reload" type="button" title="Tải lại trang (F5 / Ctrl+R)" aria-label="Tải lại">
        <svg width="13.5" height="13.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
      <button class="btn-icon" id="btn-home" type="button" title="Trang chủ (rustbrowse://home)" aria-label="Trang chủ">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>
    </div>

    <!-- Center iOS Dynamic Island Capsule -->
    <div class="island-zone" id="island-zone">
      <div class="dynamic-island" id="dynamic-island" data-state="compact">
        <!-- Security Status Dot -->
        <span class="island-sec-dot sec-internal" id="island-sec-dot" title="Kết nối an toàn"></span>

        <!-- Compact Domain Label (shown when not focused, click focuses input) -->
        <button class="island-domain-btn" id="island-domain-btn" type="button" title="Nhấp để nhập địa chỉ hoặc tìm kiếm (Ctrl+L)">
          <span class="island-domain-text" id="island-domain-text">rustbrowse://home</span>
        </button>

        <!-- Full Address Input -->
        <input
          type="text"
          id="address-input"
          class="address-input"
          spellcheck="false"
          autocomplete="off"
          placeholder="Tìm kiếm Google hoặc nhập URL..."
          aria-label="Thanh địa chỉ"
        >

        <!-- Live Dynamic Island Event Pill -->
        <button class="island-event-pill" id="island-event-pill" type="button" hidden>
          <span class="island-event-dot" id="island-event-dot"></span>
          <span class="island-event-label" id="island-event-label"></span>
        </button>

        <!-- Audio Mini-Bar inside Island when a tab is playing audio -->
        <button class="island-audio-bar" id="island-audio-bar" type="button" hidden title="Đang phát âm thanh (nhấp để tắt/bật tiếng)">
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
        </button>

        <!-- Inline Quick Tools -->
        <div class="island-inline-actions">
          <button class="btn-icon-inside" id="btn-palette" type="button" title="Bảng lệnh & Tìm Tab nhanh (Ctrl+K)" aria-label="Bảng lệnh nhanh">
            <svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <button class="btn-icon-inside" id="btn-copy-clean-url" type="button" title="Sao chép link sạch (Ctrl+Shift+C)">
            <svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
          <button class="btn-icon-inside" id="btn-reader-mode" type="button" title="Chế độ đọc báo Reader Mode (Alt+R)">
            <svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
          </button>
          <button class="btn-icon-inside btn-go" id="btn-go" type="button" title="Truy cập (Enter)">
            <svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Right Action Cluster (100% Working Controls) -->
    <div class="action-cluster">
      <!-- Video Downloader Trigger + Live Badge -->
      <button class="badge-btn badge-video" id="btn-videos" type="button" title="Trình tải Video (Video Sniffer & yt-dlp)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span class="badge-count" id="video-count">0</span>
      </button>

      <!-- Shield Overlay Trigger + Live Blocked Count -->
      <button class="badge-btn badge-shield" id="btn-shield" type="button" title="RustBrowse Shield (Chặn quảng cáo & Tracker)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span class="badge-count" id="shield-count">0</span>
      </button>

      <!-- Live RAM Monitor Badge -> Opens Floating RAM Overlay -->
      <button class="badge-btn badge-ram ram-green" id="btn-ram-badge" type="button" title="Bộ nhớ thực tế (Bấm để mở RAM Monitor & Auto-Clean)">
        <span class="ram-dot"></span>
        <span id="ram-text">-- MB</span>
      </button>

      <!-- Super Boost UI Toggle -->
      <button class="btn-icon btn-superboost" id="btn-superboost" type="button" title="Super Boost UI (Bật/tắt làm đẹp giao diện web)" aria-pressed="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </button>

      <!-- Theme Toggle (Bright Glass / Midnight Dark) -->
      <button class="btn-icon" id="btn-theme" type="button" title="Chuyển giao diện Sáng (Bright Glass) / Tối (Midnight Dark)" aria-label="Đổi giao diện">
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <!-- Downloads Manager -->
      <button class="btn-icon" id="btn-downloads" type="button" title="Quản lý tải xuống (Ctrl+J)" aria-label="Tải xuống">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </button>

      <!-- Settings & Quick Menu Overlay -->
      <button class="btn-icon" id="btn-settings" type="button" title="Menu & Cài đặt (Alt+S)" aria-label="Cài đặt">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
